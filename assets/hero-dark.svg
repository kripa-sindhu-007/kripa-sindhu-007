<svg width="1280" height="340" viewBox="0 0 1280 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kripa Sindhu — Software Engineer at BeatRoute. Work, open source, side projects, family and fun.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#12151E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1020 40) rotate(115) scale(420 560)">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#FFFFFF" fill-opacity="0.035"/>
    </pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <style>
      .name { font: 700 54px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #E6EDF3; letter-spacing: -1px; }
      .role { font: 500 19px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #A5B4FC; }
      .tag  { font: 400 15.5px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #8B949E; }
      .lblsm{ font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #6E7681; }
      .spoke { animation: flow 5s ease-in-out infinite; }
      .s2 { animation-delay: .5s } .s3 { animation-delay: 1s } .s4 { animation-delay: 1.5s } .s5 { animation-delay: 2s }
      @keyframes flow { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { .spoke { animation: none; opacity: .6 } }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#dots)"/>
  <rect width="1280" height="340" fill="url(#glow)"/>

  <!-- identity -->
  <text x="72" y="140" class="name">Kripa Sindhu</text>
  <text x="72" y="180" class="role">Software Engineer · BeatRoute</text>
  <text x="72" y="216" class="tag">Full-stack product work by day. Distributed systems you can watch work —</text>
  <text x="72" y="242" class="tag">real benchmarks, chaos tests, honest docs.</text>

  <!-- me, and the five sides of it -->
  <g transform="translate(776 40)">
    <line class="spoke s1" x1="230" y1="132" x2="230" y2="32" stroke="#818CF8" stroke-opacity="0.32" stroke-width="2"/>
    <line class="spoke s2" x1="230" y1="132" x2="416" y2="101" stroke="#818CF8" stroke-opacity="0.32" stroke-width="2"/>
    <line class="spoke s3" x1="230" y1="132" x2="345" y2="213" stroke="#818CF8" stroke-opacity="0.32" stroke-width="2"/>
    <line class="spoke s4" x1="230" y1="132" x2="115" y2="213" stroke="#818CF8" stroke-opacity="0.32" stroke-width="2"/>
    <line class="spoke s5" x1="230" y1="132" x2="44" y2="101" stroke="#818CF8" stroke-opacity="0.32" stroke-width="2"/>

    <g transform="translate(202 4)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#161B27" stroke="#30363D"/>
      <rect x="15" y="25" width="26" height="16" rx="3" stroke="#818CF8" stroke-width="1.8" fill="none"/><path d="M23 25v-3.5a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3V25" stroke="#818CF8" stroke-width="1.8" fill="none"/>
      <text x="28" y="-14" text-anchor="middle" class="lblsm">work</text>
    </g>
    <g transform="translate(388 73)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#161B27" stroke="#30363D"/>
      <circle cx="21" cy="19" r="3.5" stroke="#818CF8" stroke-width="1.8" fill="none"/><circle cx="37" cy="37" r="3.5" stroke="#818CF8" stroke-width="1.8" fill="none"/><path d="M21 22.5v6a6 6 0 0 0 6 6h6.5" stroke="#818CF8" stroke-width="1.8" fill="none"/>
      <text x="28" y="74" text-anchor="middle" class="lblsm">open source</text>
    </g>
    <g transform="translate(317 185)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#161B27" stroke="#30363D"/>
      <rect x="17" y="17" width="9" height="9" rx="2" stroke="#818CF8" stroke-width="1.8" fill="none"/><rect x="30" y="17" width="9" height="9" rx="2" stroke="#818CF8" stroke-width="1.8" fill="none"/><rect x="17" y="30" width="9" height="9" rx="2" stroke="#818CF8" stroke-width="1.8" fill="none"/><rect x="30" y="30" width="9" height="9" rx="2" stroke="#818CF8" stroke-width="1.8" fill="none"/>
      <text x="28" y="74" text-anchor="middle" class="lblsm">projects</text>
    </g>
    <g transform="translate(87 185)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#122117" stroke="#238636"/>
      <path d="M16 30L28 20l12 10v11H16z" stroke="#4ADE80" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
      <text x="28" y="74" text-anchor="middle" class="lblsm">family</text>
    </g>
    <g transform="translate(16 73)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#122117" stroke="#238636"/>
      <path d="M28 15l3.2 8.6L40 27l-8.8 3.4L28 39l-3.2-8.6L16 27l8.8-3.4z" stroke="#4ADE80" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
      <text x="28" y="74" text-anchor="middle" class="lblsm">fun</text>
    </g>

    <g transform="translate(230 132)">
      <circle cx="0" cy="0" r="42" fill="#161B27" stroke="#818CF8" stroke-width="2"/>
      <circle cx="0" cy="-8" r="9" stroke="#818CF8" stroke-width="2" fill="none"/>
      <path d="M-16 17c3-10 9-14.5 16-14.5s13 4.5 16 14.5" stroke="#818CF8" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  <!-- bottom rule -->
  <rect x="0" y="338" width="1280" height="2" fill="url(#rule)"/>
</svg>
